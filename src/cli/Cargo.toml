[package]
name = "qtcloud-media-cli"
version = "0.1.5"
edition = "2024"
description = "量潮媒体云命令行工具：公众号排版与草稿箱直出"
authors = ["QuantTide <opensource@quanttide.com>"]
license = "Apache-2.0"
repository = "https://github.com/quanttide/qtcloud-media"

[[bin]]
name = "qtcloud-media"
path = "src/main.rs"

[lib]
name = "qtcloud_media_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
regex = "1"
agent-skills-rs = "0.3"
